name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to use for the release (e.g. v0.1.0)'
        required: true
        default: 'v0.0.0'

permissions:
  contents: write

jobs:
  build-android:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "name=${TAG}" >> "$GITHUB_OUTPUT"
          # Strip leading "v" for the APK filename, e.g. v0.1.0 -> 0.1.0
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Validate required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [ -z "$KEYSTORE_BASE64" ]    && missing+=("ANDROID_KEYSTORE_BASE64")
          [ -z "$KEYSTORE_PASSWORD" ]  && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -z "$KEY_ALIAS" ]          && missing+=("ANDROID_KEY_ALIAS")
          [ -z "$KEY_PASSWORD" ]       && missing+=("ANDROID_KEY_PASSWORD")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required GitHub Secrets: ${missing[*]}"
            echo "::error::See README 'Releasing an Android build' for setup instructions."
            exit 1
          fi

      - name: Run Expo prebuild (Android)
        run: bunx expo prebuild --platform android --clean --no-install

      - name: Decode release keystore and detect alias
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EXPECTED_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

          # Auto-detect the actual alias inside the keystore. PowerShell-generated
          # PKCS12 files don't always store the alias as the FriendlyName the user
          # typed (the underlying X509Certificate2.Export uses a different field),
          # so we never trust the ANDROID_KEY_ALIAS secret literally — we resolve
          # whatever Java's PKCS12 reader actually sees as the alias.
          KEYTOOL_OUT=$(keytool -list \
            -keystore android/app/release.keystore \
            -storepass "$KEYSTORE_PASSWORD" 2>&1)

          echo "$KEYTOOL_OUT"

          DETECTED_ALIAS=$(echo "$KEYTOOL_OUT" \
            | grep -E ', PrivateKeyEntry|, KeyEntry' \
            | head -1 \
            | sed 's/,.*//')

          if [ -z "$DETECTED_ALIAS" ]; then
            echo "::error::Could not detect any key entry in the keystore."
            exit 1
          fi

          echo "Detected key alias: '$DETECTED_ALIAS'"
          if [ -n "$EXPECTED_ALIAS" ] && [ "$DETECTED_ALIAS" != "$EXPECTED_ALIAS" ]; then
            echo "::notice::ANDROID_KEY_ALIAS secret ('$EXPECTED_ALIAS') differs from actual keystore alias ('$DETECTED_ALIAS'). Using the actual alias for signing."
          fi

          echo "DETECTED_KEY_ALIAS=$DETECTED_ALIAS" >> "$GITHUB_ENV"

      - name: Patch build.gradle with release signing config
        run: node scripts/patch-android-signing.mjs

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.DETECTED_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk \
             "artifacts/memoir-${{ steps.tag.outputs.version }}.apk"
          ls -lh artifacts/

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: memoir-android-${{ steps.tag.outputs.version }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Memoir ${{ steps.tag.outputs.name }}
          files: artifacts/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Install Memoir on Android

            1. **Download** `memoir-${{ steps.tag.outputs.version }}.apk` from the Assets section below.
            2. **Open** the downloaded APK on your phone.
            3. The first time you sideload an app, Android will block the install. Tap **Settings** when it appears and toggle **"Allow from this source"** on for the app that downloaded the APK (Chrome, Firefox, Files, etc.), then back out and tap the APK again.
            4. Google Play Protect will show **"App not recognised"** — this is normal for any app installed outside the Play Store. Tap **"Install anyway"** (or **"More details" → "Install anyway"** on newer versions of Android).
            5. Launch **Memoir** and grant photo-library access when prompted. You can choose **"Allow all photos"** or **"Allow selected photos"** — Memoir works in both modes.

            ### Why the security warnings?

            Memoir is **signed with a stable release key** (V1 + V2 + V3 signing schemes), so once you install this version every future update will install in place without re-prompting. The "unknown source" and "Play Protect" warnings appear because the APK isn't being distributed through the Play Store — not because anything is wrong with the app.

            ### Privacy

            Memoir is a **local-only** gallery. No photos, accounts, telemetry, or analytics ever leave your device. The source code for this release is at the tag below.

            **Requires Android 7.0 (API 24) or newer.**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
